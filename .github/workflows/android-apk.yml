name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'widgets/android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'widgets/android/**'
      - '.github/workflows/android-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use SDK already installed on GitHub runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Assemble installable debug APK
        working-directory: widgets/android
        run: gradle --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LightFlow-Android-debug-APK
          path: widgets/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
