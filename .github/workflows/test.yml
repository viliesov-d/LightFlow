name: Test
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Advisory official-source HTML probe
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/probe-source.mjs
